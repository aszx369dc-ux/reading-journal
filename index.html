<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="description" content="不需登入、只存在此裝置的每日閱讀筆記。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="閱讀筆記" />
    <title>每日閱讀筆記</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div><p class="eyebrow">每日閱讀</p><h1>留下一點讀過的痕跡</h1></div>
        <button id="today-button" class="text-button" type="button">回到今天</button>
      </header>
      <section class="editor-card" aria-labelledby="date-heading">
        <div class="date-row">
          <div>
            <p id="date-heading" class="date-label"></p>
            <label for="entry-date" class="sr-only">選擇日期</label>
            <input id="entry-date" class="date-input" type="date" />
          </div>
          <span id="draft-badge" class="draft-badge" hidden>草稿</span>
        </div>
        <label class="writing-label" for="entry-content">今天讀到了什麼？</label>
        <textarea id="entry-content" rows="14" spellcheck="true" autocomplete="off" enterkeyhint="enter" placeholder="自由寫下想記住的句子、念頭或感受⋯" disabled></textarea>
        <div class="save-row">
          <button id="save-button" class="primary-button" type="button" disabled>儲存今天</button>
          <p id="save-status" class="status" role="status" aria-live="polite">正在開啟本機筆記⋯</p>
        </div>
      </section>
      <section class="history-section" aria-labelledby="history-heading">
        <div class="section-heading"><h2 id="history-heading">過去的日子</h2><span id="entry-count" class="count"></span></div>
        <div id="history-list" class="history-list"></div>
      </section>
      <section class="backup-section" aria-labelledby="backup-heading">
        <h2 id="backup-heading">備份</h2>
        <p>資料只存在此裝置的這個瀏覽器中。清除網站資料可能會遺失筆記，請定期匯出 JSON 備份。</p>
        <div class="backup-actions">
          <button id="export-button" class="quiet-button" type="button" disabled>匯出 JSON</button>
          <button id="import-button" class="quiet-button" type="button" disabled>匯入 JSON</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
        <p id="data-status" class="status" role="status" aria-live="polite"></p>
        <details class="legacy-help">
          <summary>搬移舊版筆記</summary>
          <p>這台瀏覽器若有更早的本機版資料，會自動複製到新版，原資料仍會保留。Supabase 雲端筆記不會自動下載；請先到舊版匯出頁登入並下載，再回來匯入。</p>
          <a href="legacy-cloud-export.html">開啟舊雲端筆記匯出頁</a>
        </details>
      </section>
    </main>
    <dialog id="import-dialog" aria-labelledby="import-title">
      <form method="dialog" class="dialog-card">
        <h2 id="import-title">確認匯入</h2>
        <p id="import-summary"></p>
        <div id="conflict-list" class="conflict-list"></div>
        <div class="dialog-actions">
          <button id="import-cancel" class="quiet-button" value="cancel">取消</button>
          <button id="import-skip" class="quiet-button" value="skip">保留目前版本</button>
          <button id="import-overwrite" class="primary-button" value="overwrite">以備份覆蓋衝突</button>
        </div>
      </form>
    </dialog>
    <noscript>此筆記工具需要 JavaScript 才能在瀏覽器內保存資料。</noscript>
    <script src="app.js" defer></script>
  </body>
</html>
